# =============================================================================
# sub2api Agent Ledger — standalone Docker Compose
# =============================================================================
# 独立部署插件，不修改主服务 compose。主服务通过 HTTP 只读访问。
#
# 用法（在仓库根目录）:
#   1. cp deploy/agent-ledger/.env.example deploy/agent-ledger/.env
#   2. 编辑 .env（至少 SESSION_SECRET / PLUGIN_MASTER_KEY / BOOTSTRAP_ADMIN_PASSWORD）
#   3. docker compose -f deploy/agent-ledger/docker-compose.yml --env-file deploy/agent-ledger/.env up -d --build
#   4. 访问 http://localhost:4173
#
# 连接本机主服务时，MAIN_SERVICE_BASE_URL 可用:
#   http://host.docker.internal:8080
# =============================================================================

services:
  agent-ledger:
    build:
      context: ../..
      dockerfile: deploy/agent-ledger/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    image: ${AGENT_LEDGER_IMAGE:-sub2api-agent-ledger:local}
    container_name: ${AGENT_LEDGER_CONTAINER_NAME:-sub2api-agent-ledger}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${AGENT_LEDGER_PORT:-4173}:4173"
    volumes:
      - agent_ledger_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4173
      PLUGIN_DATA_DIR: /app/data
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PLUGIN_MASTER_KEY: ${PLUGIN_MASTER_KEY:?PLUGIN_MASTER_KEY is required}
      MAIN_SERVICE_BASE_URL: ${MAIN_SERVICE_BASE_URL:-http://host.docker.internal:8080}
      MAIN_SERVICE_ADMIN_API_KEY: ${MAIN_SERVICE_ADMIN_API_KEY:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent_ledger_data:
    name: ${AGENT_LEDGER_VOLUME_NAME:-sub2api_agent_ledger_data}
